services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: payload_dev
      POSTGRES_PASSWORD: payload_dev_pass
      POSTGRES_DB: payload_dev_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payload_dev", "-d", "payload_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword; do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing localminio/payload-media;
      /usr/bin/mc policy set download localminio/payload-media;
      echo 'Bucket payload-media initialized successfully!';
      exit 0;
      "

  payload:
    image: ghcr.io/ralder123/gmx-payload/payload3:latest
    pull_policy: always
    container_name: payload
    restart: unless-stopped
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    extra_hosts:
      - "2.24.222.86.nip.io:127.0.0.1"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      TRUST_PROXIES: "true"
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://2.24.222.86.nip.io}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://2.24.222.86.nip.io}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-0fea807c6a545d3e4c36aa1c}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - payload

volumes:
  pgdata:
    external: true
    name: gmx_payload_pgdata
  miniodata:
    external: true
    name: gmx_payload_miniodata
  caddy_data:
  caddy_config:
